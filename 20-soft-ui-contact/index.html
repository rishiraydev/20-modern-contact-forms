<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Neumorphism UI</title>
    <meta name="description" content="A soft UI / neumorphism contact form.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="neumorphic-container">
        
        <div class="card">
            
            <div class="card-header">
                <h1>Get in Touch</h1>
                <p>Send a message and we'll reply shortly.</p>
            </div>

            <form id="softForm" class="soft-form" novalidate>
                
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </span>
                        <input type="text" id="name" name="name" placeholder="Full Name" required>
                    </div>
                    <span class="error-msg">Name is required</span>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="Email Address" required>
                    </div>
                    <span class="error-msg">Valid email required</span>
                </div>

                <div class="input-group">
                    <div class="input-wrapper textarea-wrapper">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </span>
                        <textarea id="message" name="message" rows="4" placeholder="Your Message" required></textarea>
                    </div>
                    <span class="error-msg">Message is required</span>
                </div>

                <button type="submit" class="neu-btn" id="submitBtn">
                    <span class="btn-text">Send Message</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="success-state" id="successState">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2>Message Sent</h2>
                <p>Thank you! We will get back to you soon.</p>
                <button class="neu-btn reset-btn" id="resetBtn">Go Back</button>
            </div>

        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
